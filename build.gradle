plugins {
    id "org.sonarqube" version "6.2.0.5505"
    id 'java'
}

sonar {
    properties {
        property "sonar.projectKey", "kousen_spring-and-spring-boot"
        property "sonar.organization", "kousen-it-inc"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

allprojects {
    group = 'com.kousenit'
    
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Include templates/config in analysis so Sonar can check them (e.g. Thymeleaf XSS).
    // Exclude the H2 seed scripts: Sonar treats .sql as PL/SQL and warns about
    // a missing Oracle data dictionary.
    sonar {
        properties {
            property 'sonar.sources', 'src/main/java,src/main/resources'
            property 'sonar.exclusions', '**/*.sql'
        }
    }

    tasks.withType(Test).tap {
        configureEach {
            useJUnitPlatform()
        }
    }
}

wrapper {
    gradleVersion = '9.6.1'
    distributionType = Wrapper.DistributionType.BIN
}